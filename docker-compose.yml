services:
  lanjut-landpage:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3030
    ports:
      - "3030:3030"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-3030}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
