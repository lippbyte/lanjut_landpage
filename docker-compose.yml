services:
  lanjut-landpage:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3020
    expose:
      - "3020"
    # Jika Nginx sekolah berada di host VPS yang sama (di luar Dokploy),
    # aktifkan bagian ports di bawah ini agar Nginx sekolah bisa proxy_pass ke 127.0.0.1:3000:
    # ports:
    #   - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-3000}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
